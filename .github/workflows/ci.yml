name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限；只有发布镜像的 job 才额外申请 packages: write
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 编译检查
        run: python -m compileall -q bot.py core.py

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

  docker:
    name: 构建镜像并冒烟测试
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（本地加载，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: clinepass-tg-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像内自检
        run: |
          set -euxo pipefail
          # 代码与控制台脚本能导入，且默认额度接口指向官方路径
          docker run --rm clinepass-tg-bot:ci python -c "import bot, core; assert core.DEFAULT_USAGE_PATH == '/api/v1/users/me/plan/usage-limits'; print('import ok')"
          # 容器以非 root 运行
          test "$(docker run --rm clinepass-tg-bot:ci id -u)" = "10001"
          # 命名卷里能原子写配置（挂载目录而不是文件）
          docker volume create ci-smoke >/dev/null
          docker run --rm -v ci-smoke:/app/data clinepass-tg-bot:ci \
            python -c "import core; s = core.ConfigStore('/app/data/config.json'); s.add(1, 'ci', 'sk_ci_smoke'); print('config ok:', s.keys(1))"
          docker volume rm ci-smoke >/dev/null

      - name: 未配置 Token 时应当以退出码 1 结束
        run: |
          set -euo pipefail
          code=0
          docker run --rm clinepass-tg-bot:ci python bot.py || code=$?
          echo "exit code = $code"
          test "$code" -eq 1

  publish:
    name: 推送镜像到 GHCR
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 计算镜像名（GHCR 要求全小写）
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签与注解
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
